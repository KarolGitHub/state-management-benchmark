<div class="container">
  <div class="jumbotron">
    <div class="row">
      <div class="col-md-6">
        <h1>AngularJS</h1>
      </div>
      <div class="col-md-6">
        <div class="row">
          <div class="col-sm-6 smallpad">
            <button type="button" class="btn btn-primary btn-block" id="create" ng-click="$ctrl.run()">
              Create 1,000 rows
            </button>
          </div>
          <div class="col-sm-6 smallpad">
            <button type="button" class="btn btn-primary btn-block" id="createLots" ng-click="$ctrl.runLots()">
              Create 10,000 rows
            </button>
          </div>
          <div class="col-sm-6 smallpad">
            <button type="button" class="btn btn-primary btn-block" id="add" ng-click="$ctrl.add()">
              Append 1,000 rows
            </button>
          </div>
          <div class="col-sm-6 smallpad">
            <button type="button" class="btn btn-primary btn-block" id="update" ng-click="$ctrl.update()">
              Update every 10th row
            </button>
          </div>
          <div class="col-sm-6 smallpad">
            <button type="button" class="btn btn-primary btn-block" id="clear" ng-click="$ctrl.clear()">Clear</button>
          </div>
          <div class="col-sm-6 smallpad">
            <button type="button" class="btn btn-primary btn-block" id="swapRows" ng-click="$ctrl.swapRows()">
              Swap Rows
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <table class="table table-hover table-striped test-data">
    <tbody>
      <tr
        ng-repeat="item in $ctrl.data track by item.id"
        ng-class="{ danger: item.id === $ctrl.selected }"
        ng-click="$ctrl.select(item)"
      >
        <td class="col-md-1">{{item.id}}</td>
        <td class="col-md-4">{{item.firstName}}</td>
        <td class="col-md-4">{{item.lastName}}</td>
        <td class="col-md-4">{{item.birthday}}</td>
        <td class="col-md-4">{{item.email}}</td>
        <td class="col-md-1">
          <a ng-click="$ctrl.delete(item)"
            ><span class="glyphicon glyphicon-remove text-danger" aria-hidden="true"></span
          ></a>
        </td>
        <td class="col-md-6"></td>
      </tr>
    </tbody>
  </table>
  <span class="preloadicon glyphicon glyphicon-remove" aria-hidden="true"></span>
</div>
